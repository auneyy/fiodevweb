<!-- Background Animation -->
<!-- STITCH_THREEJS_START:ANIMATION_19 class="absolute inset-0 w-full h-full z-0" -->
<div class="absolute inset-0 w-full h-full z-0" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_19" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_19');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x1976D2, 2);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

const purpleLight = new THREE.PointLight(0x9C27B0, 2);
purpleLight.position.set(-5, -5, 5);
scene.add(purpleLight);

// Glass Blocks
const blocks = [];
const geometry = new THREE.BoxGeometry(1, 1, 1);

for (let i = 0; i < 15; i++) {
    const material = new THREE.MeshPhongMaterial({
        color: i % 2 === 0 ? 0x1976D2 : 0x9C27B0,
        transparent: true,
        opacity: 0.15,
        shininess: 100,
        specular: 0xffffff
    });

    const block = new THREE.Mesh(geometry, material);
    
    // Random position
    block.position.x = (Math.random() - 0.5) * 15;
    block.position.y = (Math.random() - 0.5) * 10;
    block.position.z = (Math.random() - 0.5) * 5;
    
    // Random scale
    const s = Math.random() * 1.5 + 0.5;
    block.scale.set(s * 1.5, s * 0.8, s * 0.4);
    
    // Random rotation speeds
    block.userData.rotSpeedX = (Math.random() - 0.5) * 0.01;
    block.userData.rotSpeedY = (Math.random() - 0.5) * 0.01;
    
    // Random float speed
    block.userData.floatSpeed = Math.random() * 0.005 + 0.002;
    block.userData.floatOffset = Math.random() * Math.PI * 2;

    scene.add(block);
    blocks.push(block);
}

camera.position.z = 8;

function animate() {
    requestAnimationFrame(animate);
    
    const time = Date.now() * 0.001;
    
    blocks.forEach(block => {
        block.rotation.x += block.userData.rotSpeedX;
        block.rotation.y += block.userData.rotSpeedY;
        
        // Floating movement
        block.position.y += Math.sin(time + block.userData.floatOffset) * block.userData.floatSpeed;
    });

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();

})();
</script>

<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password-input');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility_off';
            }
        }
